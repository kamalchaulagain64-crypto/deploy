<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student | Student Management System</title>

    <link rel="stylesheet" href="add.css">
</head>

<body>

    <main class="page-container">

        <section class="student-card">

            <!-- Header -->
            <header class="form-header">

                <a href="index.html" class="back-link">
                    ← Back to Home
                </a>

                <div class="form-icon">
                    🎓
                </div>

                <h1>Add Student</h1>

                <p>
                    Enter the student's information below
                </p>

            </header>


            <!-- Form -->
            <form
                class="form"
                id="studentForm"
                onsubmit="getName(event)"
            >

                <!-- Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter student's full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="student@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Contact -->
                <div class="form-group">

                    <label for="contact">
                        Contact Number
                    </label>

                    <input
                        type="tel"
                        id="contact"
                        name="contact"
                        placeholder="Enter contact number"
                        autocomplete="tel"
                        required
                    >

                </div>


                <!-- Address -->
                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        name="address"
                        placeholder="Enter student's address"
                        autocomplete="street-address"
                        required
                    >

                </div>


                <!-- Faculty -->
                <div class="form-group">

                    <label for="faculty">
                        Faculty
                    </label>

                    <select
                        id="faculty"
                        name="faculty"
                        required
                    >

                        <option value="" disabled selected>
                            Select faculty
                        </option>

                        <optgroup label="Science">
                            <option value="BSc CSIT">
                                BSc CSIT
                            </option>

                            <option value="BIT">
                                BIT
                            </option>

                            <option value="B.TECH">
                                B.TECH
                            </option>
                        </optgroup>

                        <optgroup label="Management">
                            <option value="BBA">
                                BBA
                            </option>

                            <option value="BBS">
                                BBS
                            </option>
                        </optgroup>

                        <optgroup label="Arts">
                            <option value="BA">
                                BA
                            </option>

                            <option value="BFA">
                                BFA
                            </option>
                        </optgroup>

                    </select>

                </div>


                <!-- Semester -->
                <div class="form-group">

                    <label for="semester">
                        Semester
                    </label>

                    <select
                        id="semester"
                        name="semester"
                        required
                    >

                        <option value="" disabled selected>
                            Select semester
                        </option>

                        <option value="1">
                            First Semester
                        </option>

                        <option value="2">
                            Second Semester
                        </option>

                        <option value="3">
                            Third Semester
                        </option>

                        <option value="4">
                            Fourth Semester
                        </option>

                        <option value="5">
                            Fifth Semester
                        </option>

                        <option value="6">
                            Sixth Semester
                        </option>

                    </select>

                </div>


                <!-- Buttons -->
                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Add Student
                    </button>

                    <button
                        type="reset"
                        class="btn btn-secondary"
                    >
                        Reset
                    </button>

                </div>

            </form>

        </section>

    </main>


    <script src="../scripts/script.js"></script>

</body>

</html>
